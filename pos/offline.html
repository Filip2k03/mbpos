<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b6ff5">
  <title>MBPOS — Offline</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f8fd; color: #10233f; }
    main { width: min(28rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #dce8f5; border-radius: 1.5rem; background: #fff; box-shadow: 0 20px 60px rgba(35,84,135,.12); text-align: center; }
    .mark { display: grid; place-items: center; width: 4rem; height: 4rem; margin: 0 auto 1rem; border-radius: 1.25rem; background: linear-gradient(135deg,#0b6ff5,#13b7e8); color: #fff; font-weight: 900; font-size: 1.3rem; }
    h1 { margin: 0 0 .6rem; font-size: 1.5rem; }
    p { margin: 0; color: #6b7c93; line-height: 1.6; }
    button { margin-top: 1.5rem; padding: .75rem 1rem; border: 0; border-radius: .8rem; background: #0b6ff5; color: #fff; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark">MB</div>
    <h1>MBPOS is offline</h1>
    <p>The app shell is available, but live vouchers, tracking, and database records need an internet connection.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
